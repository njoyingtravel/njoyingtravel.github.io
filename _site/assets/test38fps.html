    }

<body>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');
const fpsCounter = document.getElementById('fpsCounter');

let rotationDegrees = 0;
let tiltDegrees = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let autoRotate = false;

let targetRotation = rotationDegrees;
let targetTilt = tiltDegrees;
let animationProgress = 1; // 1 = done, 0 = just started

let animationStartTime = 0;
let animationDuration = 1000;
let startRotation = 0;
let startTilt = 0;

let arcStartLatLon = null;
let arcEndLatLon = null;
let cameraPath = [];

// FPS measurement
let frameCount = 0;
let lastTime = performance.now();
let fps = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return [
    cosLat * Math.sin(lonRad),
    Math.sin(latRad),
    cosLat * Math.cos(lonRad)
  ];
}

function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return [
    p[0] * cosA + p[2] * sinA,
    p[1],
    -p[0] * sinA + p[2] * cosA
  ];
}

function rotateX(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return [
    p[0],
    p[1] * cosA - p[2] * sinA,
    p[1] * sinA + p[2] * cosA
  ];
}

function interpolateGreatCircle(start, end, t) {
  const toRad = Math.PI / 180;
  const toDeg = 180 / Math.PI;

  const φ1 = start.lat * toRad;
  const λ1 = start.lon * toRad;
  const φ2 = end.lat * toRad;
  const λ2 = end.lon * toRad;

  const Δφ = φ2 - φ1;
  const Δλ = λ2 - λ1;

  const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
  const δ = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  if (δ === 0) return { lat: start.lat, lon: start.lon };

  const A = Math.sin((1 - t) * δ) / Math.sin(δ);
  const B = Math.sin(t * δ) / Math.sin(δ);

  const x = A * Math.cos(φ1) * Math.cos(λ1) + B * Math.cos(φ2) * Math.cos(λ2);
  const y = A * Math.cos(φ1) * Math.sin(λ1) + B * Math.cos(φ2) * Math.sin(λ2);
  const z = A * Math.sin(φ1) + B * Math.sin(φ2);

  const φ = Math.atan2(z, Math.sqrt(x * x + y * y));
  const λ = Math.atan2(y, x);

  return { lat: φ * toDeg, lon: λ * toDeg };
}

function curvedInterpolationDirectional(start, end, t) {
  const mid = interpolateGreatCircle(start, end, 0.5);

  // Compute shortest deltaLon (wrap around the globe)
  let deltaLon = end.lon - start.lon;
  if (deltaLon > 180) deltaLon -= 360;
  if (deltaLon < -180) deltaLon += 360;

  // Curve proportional to E-W direction, but not extreme
  const curveStrength = Math.sin(t * Math.PI); // peak at t = 0.5
  const latOffset = curveStrength * (deltaLon / 180) * 10; // max 10° offset

  const curvedMid = {
    lat: mid.lat + latOffset,
    lon: mid.lon
  };

  // Double interpolation to simulate bending path
  const firstLeg = interpolateGreatCircle(start, curvedMid, t);
  const secondLeg = interpolateGreatCircle(curvedMid, end, t);
  return interpolateGreatCircle(firstLeg, secondLeg, t);
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371; // Earth radius in kilometers
  const toRad = angle => angle * Math.PI / 180;

  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}

function lookAt(lat, lon) {
  rotationDegrees = -lon;
  tiltDegrees = lat;
}

function lookAnimatedAt(lat, lon, baseDurationPerDegree = 50) {
  const newRotation = -lon;
  const newTilt = lat;

  startRotation = rotationDegrees;
  startTilt = tiltDegrees;
  targetRotation = newRotation;
  targetTilt = newTilt;

  arcStartLatLon = { lat: tiltDegrees, lon: -rotationDegrees };
  arcEndLatLon = { lat, lon };

  // Compute great-circle angular distance (in degrees)
  const toRad = Math.PI / 180;
  const φ1 = arcStartLatLon.lat * toRad;
  const λ1 = arcStartLatLon.lon * toRad;
  const φ2 = arcEndLatLon.lat * toRad;
  const λ2 = arcEndLatLon.lon * toRad;

  const dφ = φ2 - φ1;
  const dλ = λ2 - λ1;

  const a = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
  const angularDistanceRad = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  const angularDistanceDeg = angularDistanceRad * (180 / Math.PI);

  // Use distance to determine duration
  animationDuration = Math.max(500, angularDistanceDeg * baseDurationPerDegree); // clamp min time
  animationStartTime = performance.now();
  animationProgress = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;
  const tiltRadians = tiltDegrees * Math.PI / 180;

  // Fill the globe
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'black';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  ctx.strokeStyle = 'black';
  ctx.lineWidth = 1.0;

  points.forEach(borderLine => { // Outer .forEach loop callback starts {
      ctx.beginPath();
      let lastX = null, lastY = null;

      borderLine.forEach((p, i) => { // Inner .forEach loop callback starts {
            const sph = sphericalToCartesian(p.lon, p.lat);
            const rotated = rotateX(rotateY(sph, rotationRadians), tiltRadians);

            if (rotated[2] >= 0) { 
                const x = cx + rotated[0] * radius;
                const y = cy - rotated[1] * radius;

                if (lastX !== null && lastY !== null) { 
                    const dx = Math.abs(x - lastX);
                    const dy = Math.abs(y - lastY);

                    //antarctida drawing hack
                    if (p.lat < -80 && (dx > 10 || dy > 10)) {
                      ctx.moveTo(x, y)
                    } else {
                      ctx.lineTo(x, y);
                    }
                    ctx.lineTo(x, y);
                } else { 
                    ctx.moveTo(x, y);
                }

                lastX = x;
                lastY = y;
            } else { 
                lastX = null;
                lastY = null;
            } 
         });

      ctx.stroke();
  });


  if (autoRotate) {
    rotationDegrees += 0.1;
    if (rotationDegrees >= 360) rotationDegrees -= 360;
  }

  // FPS counting
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    fpsCounter.textContent = `FPS: ${fps}`;
  }

  if (animationProgress < 1) {
    const now = performance.now();
    const t = Math.min((now - animationStartTime) / animationDuration, 1);

    // Smoothstep easing
    const easedT = t * t * (3 - 2 * t);

    // rotationDegrees = startRotation + (targetRotation - startRotation) * easedT;
    // tiltDegrees = startTilt + (targetTilt - startTilt) * easedT;

    const interpolated = curvedInterpolationDirectional(arcStartLatLon, arcEndLatLon, easedT);
    lookAt(interpolated.lat, interpolated.lon);

    animationProgress = t;

    cameraPath.push({ lat: tiltDegrees, lon: -rotationDegrees });
  }

  if (cameraPath.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    for (let i = 0; i < cameraPath.length; i++) {
      const { lat, lon } = cameraPath[i];
      const sph = sphericalToCartesian(lon, lat);
      const rotated = rotateX(rotateY(sph, rotationRadians), tiltRadians);
      if (rotated[2] >= 0) {
        const x = cx + rotated[0] * radius;
        const y = cy - rotated[1] * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  }

  if (cameraPath.length >= 2) {
    const p1 = cameraPath[cameraPath.length - 2];
    const p2 = cameraPath[cameraPath.length - 1];
    const sph1 = sphericalToCartesian(p1.lon, p1.lat);
    const sph2 = sphericalToCartesian(p2.lon, p2.lat);
    const rot1 = rotateX(rotateY(sph1, rotationRadians), tiltRadians);
    const rot2 = rotateX(rotateY(sph2, rotationRadians), tiltRadians);

    if (rot2[2] >= 0) {
      const x1 = cx + rot1[0] * radius;
      const y1 = cy - rot1[1] * radius;
      const x2 = cx + rot2[0] * radius;
      const y2 = cy - rot2[1] * radius;

      if (animationProgress < 1) {
        // ✈️ Draw triangle (plane)
        const dx = x2 - x1;
        const dy = y2 - y1;
        const angle = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(x2, y2);
        ctx.rotate(angle);
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-6, -3);
        ctx.lineTo(-6, 3);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // 🔴 Draw circle (destination)
        ctx.beginPath();
        ctx.fillStyle = 'red';
        ctx.arc(x2, y2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  if (cameraPath.length >= 2 && arcStartLatLon) {
    const last = cameraPath[cameraPath.length - 1];
    const sph = sphericalToCartesian(last.lon, last.lat);
    const rotated = rotateX(rotateY(sph, rotationRadians), tiltRadians);

    if (rotated[2] >= 0) {
      const x = cx + rotated[0] * radius;
      const y = cy - rotated[1] * radius;

      // Compute current distance from start to this point
      const distance = haversineKm(
        arcStartLatLon.lat,
        arcStartLatLon.lon,
        last.lat,
        last.lon
      );

      // Draw distance near the plane
      ctx.font = '22px sans-serif';
      //ctx.fillStyle = 'black';
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 10;
      ctx.textAlign = 'center';

      ctx.strokeText(`${Math.round(distance)} km`, x, y + 32);
      ctx.fillText(`${Math.round(distance)} km`, x, y + 32);
    }
  }
  requestAnimationFrame(draw);
}

</script>
