<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Fixed Boxes with Arcs v2</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>

<canvas id="globeCanvas"></canvas>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- CONTINENT DATA (from first script) ---
const continents = [
  [ {lon: -30, lat: 10}, {lon: -10, lat: 30}, {lon: 10, lat: 10}, {lon: -10, lat: -10} ], // ~Africa Box
  [ {lon: 100, lat: 20}, {lon: 140, lat: 40}, {lon: 160, lat: 10}, {lon: 120, lat: -10} ], // ~Asia/Aus Box
  [ {lon: -100, lat: 40}, {lon: -80, lat: 60}, {lon: -60, lat: 40}, {lon: -80, lat: 20} ], // ~NAm Box
  // Add a smaller one for testing edge cases
  [ {lon: -50, lat: -40}, {lon: -40, lat: -35}, {lon: -30, lat: -50}, {lon: -40, lat: -55} ] // ~SAm Box
];

// Convert lon/lat to 3D Cartesian coordinates (Unit Sphere)
function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad)
  };
}

// Rotate a point around the Y-axis (vertical)
function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA
  };
}

// Project 3D to 2D canvas coordinates (Orthographic)
function project(p, radius, cx, cy) {
  return {
    x: cx + p.x * radius,
    y: cy - p.y * radius
  };
}

// Find horizon intersection - returns the *object* { point: normalized 3D point, type: 'intersection' } or null
function findHorizonIntersection(p1, p2) {
    const epsilon = 1e-9; // Small tolerance for floating point checks
    // Check if both points are effectively on the same side of the horizon plane (z=0)
    if ((p1.z >= -epsilon && p2.z >= -epsilon) || (p1.z < epsilon && p2.z < epsilon)) {
        return null;
    }

    const dz = p1.z - p2.z;
    if (Math.abs(dz) < epsilon) return null; // Avoid division by zero / parallel to horizon

    const t = p1.z / dz; // Parameter t where z becomes 0

    // Optional: Check if intersection is within the segment bounds (helps with edge cases)
    // if (t < -epsilon || t > 1 + epsilon) return null;

    let intersection = {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t,
        z: 0 // Intersection is on the z=0 plane
    };

    const len = Math.hypot(intersection.x, intersection.y);
     if (len < epsilon) {
         // Point is extremely close to the pole-on view, treat as degenerate
         // Returning a default point on horizon, e.g., (1,0,0) might be okay
         return { point: { x: 1, y: 0, z: 0 }, type: 'intersection' };
     }

    // Normalize to ensure it lies exactly on the unit circle horizon
    intersection.x /= len;
    intersection.y /= len;

    return { point: intersection, type: 'intersection' };
}


let rotationDegrees = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;
  const epsilon = 1e-9; // Tolerance for visibility checks

  // Draw Globe Background
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'white';
  ctx.fill();

  // Draw Continents
  ctx.fillStyle = 'black';

  continents.forEach(continent => {
    const rotatedVertices = continent.map(p =>
      rotateY(sphericalToCartesian(p.lon, p.lat), rotationRadians)
    );

    // --- Build the path including clipped segments and intersection info ---
    const pathSegments = [];
    // *** FIX 1: Initialize lastPointData correctly ***
    let lastPointData = rotatedVertices[rotatedVertices.length - 1];

    for (let i = 0; i < rotatedVertices.length; i++) {
      const current = rotatedVertices[i];
      const next = rotatedVertices[(i + 1) % rotatedVertices.length]; // Wrap around

      const intersectionData = findHorizonIntersection(current, next);

      // Use epsilon for visibility check
      const currentIsVisible = current.z >= -epsilon;
      const nextIsVisible = next.z >= -epsilon;
      const lastIsVisible = lastPointData.z >= -epsilon;


      // 1. Handle the 'current' point
      if (currentIsVisible) {
        // If we are transitioning from invisible (last) to visible (current)
        if (!lastIsVisible) {
           // Find the entry intersection point
           const entryIntersectionData = findHorizonIntersection(lastPointData, current);
           if (entryIntersectionData) {
               pathSegments.push(entryIntersectionData);
           } else {
               // This case should ideally not happen if checks are robust,
               // but indicates an issue if last was invisible and current is visible
               // without a calculable intersection. Could log an error here.
               // console.warn("Missing entry intersection?");
           }
        }
        // Add the visible current point as a vertex
        pathSegments.push({ point: current, type: 'vertex' });
      }

      // 2. Handle the intersection *between* current and next (exit point)
      if (intersectionData) {
          // Add intersection if transitioning from visible (current) to invisible (next)
          if (currentIsVisible && !nextIsVisible) {
              pathSegments.push(intersectionData);
          }
          // Entry intersections (invisible -> visible) are handled above in step 1.
      }

      lastPointData = current; // Remember the current point for the next iteration
    } // End loop through vertices


    // *** FIX 2: Check for minimum number of points for a fillable area ***
    if (pathSegments.length < 3) {
        // console.log("Skipping continent, path segments < 3:", pathSegments.length);
        return; // Need at least 3 points (e.g., entry, vertex, exit) to form an area
    }


    // --- Draw the constructed path ---
    ctx.beginPath();

    let firstPointProj = project(pathSegments[0].point, radius, cx, cy);
    ctx.moveTo(firstPointProj.x, firstPointProj.y);
    // console.log("Path Segments:", pathSegments.map(s => ({type: s.type, z: s.point.z.toFixed(2)}))); // Debugging

    for (let i = 0; i < pathSegments.length; i++) {
      const currentSegment = pathSegments[i];
      const nextSegment = pathSegments[(i + 1) % pathSegments.length];

      const currentPoint = currentSegment.point;
      const nextPoint = nextSegment.point;

      const projCurr = project(currentPoint, radius, cx, cy);
      const projNext = project(nextPoint, radius, cx, cy);

      // ** ARC DRAWING LOGIC **
      if (currentSegment.type === 'intersection' && nextSegment.type === 'intersection') {
        const startAngle = Math.atan2(projCurr.y - cy, projCurr.x - cx);
        const endAngle = Math.atan2(projNext.y - cy, projNext.x - cx);

        // Ensure angles are distinct enough to draw an arc
        if (Math.abs(startAngle - endAngle) < epsilon && Math.hypot(projCurr.x - projNext.x, projCurr.y - projNext.y) < epsilon) {
             // If points are virtually identical, skip drawing arc to avoid potential issues
             // console.log("Skipping degenerate arc");
             ctx.lineTo(projNext.x, projNext.y); // Treat as line to ensure path continuity
        } else {
            const crossProductZ = currentPoint.x * nextPoint.y - currentPoint.y * nextPoint.x;
            // Determine sweep direction. View from +Z: positive cross product is CCW.
            const counterClockwise = crossProductZ > 0;

            // Adjust angles slightly if they are identical but points are different? Usually not needed with atan2.

            // Draw the arc
            ctx.arc(cx, cy, radius, startAngle, endAngle, counterClockwise);
             // console.log(`Arc: (${projCurr.x.toFixed(1)},${projCurr.y.toFixed(1)}) to (${projNext.x.toFixed(1)},${projNext.y.toFixed(1)})`);
        }

      } else {
        // Draw a straight line
        ctx.lineTo(projNext.x, projNext.y);
        // console.log(`Line: (${projCurr.x.toFixed(1)},${projCurr.y.toFixed(1)}) to (${projNext.x.toFixed(1)},${projNext.y.toFixed(1)})`);
      }
    } // End loop through path segments

    ctx.closePath(); // Close the shape
    ctx.fill();      // Fill the resulting shape
  }); // End loop through continents

  rotationDegrees += 0.1;
  if (rotationDegrees >= 360) rotationDegrees -= 360;

  requestAnimationFrame(draw);
}

// Start animation
draw();
</script>

</body>
</html>
