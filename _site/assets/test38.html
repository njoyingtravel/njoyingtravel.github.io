<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Contours Only Optimized</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="globeCanvas"></canvas>

<!-- Link to the continents.js file -->
<script src="continents.js"></script>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');

let rotationDegrees = 0;
let tiltDegrees = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let autoRotate = true;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return [
    cosLat * Math.sin(lonRad),
    Math.sin(latRad),
    cosLat * Math.cos(lonRad)
  ];
}

function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return [
    p[0] * cosA + p[2] * sinA,
    p[1],
    -p[0] * sinA + p[2] * cosA
  ];
}

function rotateX(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return [
    p[0],
    p[1] * cosA - p[2] * sinA,
    p[1] * sinA + p[2] * cosA
  ];
}

function findHorizonIntersection(p1, p2) {
  if ((p1[2] >= 0 && p2[2] >= 0) || (p1[2] < 0 && p2[2] < 0)) return null;
  const dz = p2[2] - p1[2];
  if (Math.abs(dz) < 1e-9) return null;
  const t = (0 - p1[2]) / dz;
  const intersection = [
    p1[0] + (p2[0] - p1[0]) * t,
    p1[1] + (p2[1] - p1[1]) * t,
    0
  ];
  const len = Math.hypot(intersection[0], intersection[1]);
  if (len < 1e-9) {
    return { point: [1, 0, 0], type: 'intersection' };
  }
  intersection[0] /= len;
  intersection[1] /= len;
  return { point: intersection, type: 'intersection' };
}

function subdivideContinent(continent, maxSegmentDegrees = 10) {
  const subdivided = [];
  for (let i = 0; i < continent.length; i++) {
    const current = continent[i];
    const next = continent[(i + 1) % continent.length];
    subdivided.push(current);
    const dLon = next.lon - current.lon;
    const dLat = next.lat - current.lat;
    const dist = Math.hypot(dLon, dLat);
    const segments = Math.ceil(dist / maxSegmentDegrees);
    for (let j = 1; j < segments; j++) {
      const t = j / segments;
      subdivided.push({
        lon: current.lon + dLon * t,
        lat: current.lat + dLat * t
      });
    }
  }
  return subdivided;
}

// Preprocess continents
const subdividedContinents = continents.map(continent => subdivideContinent(continent, 2));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;
  const tiltRadians = tiltDegrees * Math.PI / 180;

  // Fill the globe
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'black';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  subdividedContinents.forEach(continent => {
    const rotatedVertices = [];
    for (let i = 0; i < continent.length; i++) {
      const p = continent[i];
      if (p.lat > -84.351) {
        const sph = sphericalToCartesian(p.lon, p.lat);
        const rotated = rotateY(rotateX(sph, tiltRadians), rotationRadians);
        rotatedVertices.push(rotated);
      }
    }

    const pathSegments = [];
    for (let i = 0; i < rotatedVertices.length; i++) {
      const p1 = rotatedVertices[i];
      const p2 = rotatedVertices[(i + 1) % rotatedVertices.length];
      const intersection = findHorizonIntersection(p1, p2);

      if (p1[2] >= 0) {
        pathSegments.push({ point: p1, type: 'vertex' });
      }
      if (intersection) {
        pathSegments.push(intersection);
        if (p2[2] < 0) continue;
      }
    }

    if (pathSegments.length < 3) return;

    ctx.beginPath();
    const first = pathSegments[0].point;
    const fx = cx + first[0] * radius;
    const fy = cy - first[1] * radius;
    ctx.moveTo(fx, fy);

    for (let i = 1; i < pathSegments.length; i++) {
      const curr = pathSegments[i];
      const prev = pathSegments[i - 1];
      const currPt = curr.point;
      const prevPt = prev.point;

      const currX = cx + currPt[0] * radius;
      const currY = cy - currPt[1] * radius;
      const prevX = cx + prevPt[0] * radius;
      const prevY = cy - prevPt[1] * radius;

      if (prev.type === 'intersection' && curr.type === 'intersection') {
        const startAngle = Math.atan2(prevY - cy, prevX - cx);
        const endAngle = Math.atan2(currY - cy, currX - cx);
        const crossZ = prevPt[0] * currPt[1] - prevPt[1] * currPt[0];
        const ccw = crossZ > 0;
        ctx.arc(cx, cy, radius, startAngle, endAngle, ccw);
      } else {
        ctx.lineTo(currX, currY);
      }
    }

    const last = pathSegments[pathSegments.length - 1];
    const firstPt = pathSegments[0];
    if (last.type === 'intersection' && firstPt.type === 'intersection') {
      const lastPt = last.point;
      const firstP = firstPt.point;

      const lastX = cx + lastPt[0] * radius;
      const lastY = cy - lastPt[1] * radius;
      const firstX = cx + firstP[0] * radius;
      const firstY = cy - firstP[1] * radius;

      const startAngle = Math.atan2(lastY - cy, lastX - cx);
      const endAngle = Math.atan2(firstY - cy, firstX - cx);
      const crossZ = lastPt[0] * firstP[1] - lastPt[1] * firstP[0];
      const ccw = crossZ > 0;
      ctx.arc(cx, cy, radius, startAngle, endAngle, ccw);
    } else {
      ctx.lineTo(fx, fy);
    }

    ctx.closePath();
    ctx.stroke();
  });

  if (autoRotate) {
    rotationDegrees += 0.1;
    if (rotationDegrees >= 360) rotationDegrees -= 360;
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  autoRotate = false;
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  autoRotate = false;
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - lastMouseX;
    const deltaY = -(e.clientY - lastMouseY);

    rotationDegrees += deltaX * 0.1;
    tiltDegrees -= deltaY * 0.1;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

draw();
</script>
</body>
</html>
