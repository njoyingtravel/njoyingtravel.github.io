<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Fixed Boxes with Arcs</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>

<canvas id="globeCanvas"></canvas>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- CONTINENT DATA (from first script) ---
const continents = [
  [ {lon: -30, lat: 10}, {lon: -10, lat: 30}, {lon: 10, lat: 10}, {lon: -10, lat: -10} ],
  [ {lon: 100, lat: 20}, {lon: 140, lat: 40}, {lon: 160, lat: 10}, {lon: 120, lat: -10} ],
  [ {lon: -100, lat: 40}, {lon: -80, lat: 60}, {lon: -60, lat: 40}, {lon: -80, lat: 20} ]
];

// Convert lon/lat to 3D Cartesian coordinates (Unit Sphere)
function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad)
  };
}

// Rotate a point around the Y-axis (vertical)
function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA
  };
}

// Project 3D to 2D canvas coordinates (Orthographic)
function project(p, radius, cx, cy) {
  return {
    x: cx + p.x * radius,
    y: cy - p.y * radius
  };
}

// Find horizon intersection - returns the *object* { point: normalized 3D point, type: 'intersection' } or null
function findHorizonIntersection(p1, p2) {
    // Check if both points are on the same side of the horizon plane (z=0)
    // Use '< 0' for invisible check to be consistent
    if ((p1.z >= 0 && p2.z >= 0) || (p1.z < 0 && p2.z < 0)) {
        return null;
    }

    // Parameter t representing the intersection point along the line segment p1 -> p2
    const dz = p1.z - p2.z;
    if (Math.abs(dz) < 1e-9) return null; // Avoid division by zero

    const t = p1.z / dz; // t where z becomes 0

    // Calculate intersection point coordinates
    let intersection = {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t,
        z: 0 // Intersection is on the z=0 plane
    };

    // Normalize the intersection point's x and y so it lies exactly on the unit circle horizon
    const len = Math.hypot(intersection.x, intersection.y);
     if (len < 1e-9) { // Highly unlikely, but handle division by zero
         // You could return null or a default point depending on desired behavior
         return { point: { x: 1, y: 0, z: 0 }, type: 'intersection' }; // Default to a point on horizon
     }

    intersection.x /= len;
    intersection.y /= len;

    // Return the object structure needed for the drawing logic
    return { point: intersection, type: 'intersection' };
}


let rotationDegrees = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;

  // Draw Globe Background
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'white'; // Keep original colors
  ctx.fill();
  // Optional: Add outline for clarity
  // ctx.strokeStyle = 'grey';
  // ctx.lineWidth = 1;
  // ctx.stroke();


  // Draw Continents
  ctx.fillStyle = 'black'; // Keep original colors

  continents.forEach(continent => {
    const rotatedVertices = continent.map(p =>
      rotateY(sphericalToCartesian(p.lon, p.lat), rotationRadians)
    );

    // --- Build the path including clipped segments and intersection info ---
    const pathSegments = []; // Will store objects { point: ..., type: 'vertex' | 'intersection' }
    let lastPointData = null; // Keep track of the previous point's data (including z)

    for (let i = 0; i < rotatedVertices.length; i++) {
      const current = rotatedVertices[i];
      const next = rotatedVertices[(i + 1) % rotatedVertices.length]; // Wrap around

      const intersectionData = findHorizonIntersection(current, next); // Returns object or null

      // --- Logic to add points and intersections to pathSegments ---

      // 1. Handle the 'current' point
      if (current.z >= 0) { // Current point is visible
        // If the *previous* point was invisible, we must have crossed the horizon *entering* view
        if (lastPointData && lastPointData.z < 0) {
           const entryIntersectionData = findHorizonIntersection(lastPointData, current); // Find where we entered
           if (entryIntersectionData) {
               pathSegments.push(entryIntersectionData);
           }
        }
        // Add the visible current point as a vertex
        pathSegments.push({ point: current, type: 'vertex' });
      }

      // 2. Handle the intersection *between* current and next
      if (intersectionData) {
          // We only care about intersections where we are *exiting* view (current visible, next invisible)
          // The entry intersection is handled above when processing the *next* point (which becomes 'current').
          if (current.z >= 0 && next.z < 0) {
              pathSegments.push(intersectionData);
          }
          // If current is invisible and next is visible, the intersection point
          // will be added as an 'entry' point when 'next' is processed.
      }

      lastPointData = current; // Remember the current point for the next iteration's entry check
    } // End loop through vertices

    // --- Draw the constructed path ---
    if (pathSegments.length < 2) return; // Need at least two points/intersections

    ctx.beginPath();

    // Move to the first point in the visible path
    let firstPointProj = project(pathSegments[0].point, radius, cx, cy);
    ctx.moveTo(firstPointProj.x, firstPointProj.y);

    for (let i = 0; i < pathSegments.length; i++) {
      const currentSegment = pathSegments[i];
      const nextSegment = pathSegments[(i + 1) % pathSegments.length]; // Wrap around for closing path/arc

      const currentPoint = currentSegment.point; // 3D point (or normalized intersection)
      const nextPoint = nextSegment.point;     // 3D point (or normalized intersection)

      const projCurr = project(currentPoint, radius, cx, cy); // 2D projection
      const projNext = project(nextPoint, radius, cx, cy);     // 2D projection

      // ** ARC DRAWING LOGIC **
      // If the edge connects two horizon intersection points, draw an arc
      if (currentSegment.type === 'intersection' && nextSegment.type === 'intersection') {

        // Calculate angles for the arc on the 2D canvas
        const startAngle = Math.atan2(projCurr.y - cy, projCurr.x - cx);
        const endAngle = Math.atan2(projNext.y - cy, projNext.x - cx);

        // Determine drawing direction (counter-clockwise?)
        // Use the 3D coordinates before projection for the cross product.
        // The sign tells us the direction relative to the view (+Z axis).
        const crossProductZ = currentPoint.x * nextPoint.y - currentPoint.y * nextPoint.x;

        // If crossProductZ is positive, the path from current to next goes counter-clockwise
        // around the Z-axis when viewed from positive Z.
        const counterClockwise = crossProductZ > 0;

        // Draw the arc along the globe's horizon
        ctx.arc(cx, cy, radius, startAngle, endAngle, counterClockwise);

        // ctx.arc implicitly moves the current path position to the end of the arc (projNext).
        // The next iteration will correctly start from projNext.

      } else {
        // Otherwise (if connecting vertex-to-vertex, vertex-to-intersection, or intersection-to-vertex),
        // draw a straight line to the next projected point.
        ctx.lineTo(projNext.x, projNext.y);
      }
    } // End loop through path segments

    ctx.closePath(); // Close the shape (connects last point back to first)
    ctx.fill();      // Fill the resulting shape
  }); // End loop through continents

  rotationDegrees += 0.1; // Keep original speed
  if (rotationDegrees >= 360) rotationDegrees -= 360;

  requestAnimationFrame(draw);
}

// Start animation
draw();
</script>

</body>
</html>
