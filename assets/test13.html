<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Fixed Boxes</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="globeCanvas"></canvas>
<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const continents = [
  [ {lon: -18, lat: 35}, {lon: 40, lat: 30}, {lon: 35, lat: 0}, {lon: 20, lat: -30}, {lon: -5, lat: -20}, {lon: -10, lat: 10} ],
  [ {lon: 90, lat: 50}, {lon: 150, lat: 60}, {lon: 170, lat: 0}, {lon: 140, lat: -30}, {lon: 110, lat: -20}, {lon: 80, lat: 10} ],
  [ {lon: -120, lat: 60}, {lon: -50, lat: 70}, {lon: -40, lat: 20}, {lon: -60, lat: -40}, {lon: -80, lat: -50}, {lon: -100, lat: 0}, {lon: -110, lat: 30} ]
];

function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad),
    lon: lon, lat: lat
  };
}

function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA,
  };
}

function project(p, radius, cx, cy) {
  return {
    x: cx + p.x * radius,
    y: cy - p.y * radius
  };
}

function findHorizonIntersection(p1, p2) {
  if ((p1.z >= 0 && p2.z >= 0) || (p1.z < 0 && p2.z < 0)) {
    return null;
  }
  const dz = p1.z - p2.z;
  if (Math.abs(dz) < 1e-9) return null;
  const t = p1.z / dz;
  let intersection = {
    x: p1.x + (p2.x - p1.x) * t,
    y: p1.y + (p2.y - p1.y) * t,
    z: 0
  };
  const len = Math.hypot(intersection.x, intersection.y);
  if (len < 1e-9) return intersection;
  intersection.x /= len;
  intersection.y /= len;
  return intersection;
}

let rotationDegrees = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'lightblue';
  ctx.fill();
  ctx.strokeStyle = 'grey';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = 'darkgreen';

  continents.forEach(continent => {
    const rotatedVertices = continent.map(p =>
      rotateY(sphericalToCartesian(p.lon, p.lat), rotationRadians)
    );

    const pathSegments = [];
    let lastVisiblePoint = null;

    for (let i = 0; i < rotatedVertices.length; i++) {
      const current = rotatedVertices[i];
      const next = rotatedVertices[(i + 1) % rotatedVertices.length];

      const intersection = findHorizonIntersection(current, next);

      if (current.z >= 0) {
        if (lastVisiblePoint && lastVisiblePoint.z < 0) {
          const entryIntersection = findHorizonIntersection(lastVisiblePoint, current);
          if (entryIntersection) {
            pathSegments.push({ point: entryIntersection, type: 'entry' });
          }
        }
        pathSegments.push({ point: current, type: 'vertex' });
      }

      if (intersection) {
        if (current.z >= 0 && next.z < 0) {
          pathSegments.push({ point: intersection, type: 'exit' });
        } else if (current.z < 0 && next.z >= 0) {
          pathSegments.push({ point: intersection, type: 'entry' });
        }
      }
      lastVisiblePoint = current;
    }

    const fragments = [];
    let currentFragment = [];
    for (let i = 0; i < pathSegments.length; i++) {
      const segment = pathSegments[i];
      if (currentFragment.length === 0) {
        currentFragment.push(segment);
      } else {
        const prevSegment = pathSegments[i - 1];
        if (prevSegment.type === 'exit' && segment.type === 'entry') {
          fragments.push(currentFragment);
          currentFragment = [segment];
        } else {
          currentFragment.push(segment);
        }
      }
    }
    fragments.push(currentFragment);

    fragments.forEach(fragment => {
      if (fragment.length < 2) return;

      ctx.beginPath();
      const firstProj = project(fragment[0].point, radius, cx, cy);
      ctx.moveTo(firstProj.x, firstProj.y);

      for (let i = 0; i < fragment.length; i++) {
        const current = fragment[i];
        const next = fragment[(i + 1) % fragment.length];

        const projCurrent = project(current.point, radius, cx, cy);
        const projNext = project(next.point, radius, cx, cy);

        if (current.type === 'exit' && next.type === 'entry') continue;

        if (current.type.endsWith('intersection') && next.type.endsWith('intersection')) {
          const startAngle = Math.atan2(projCurrent.y - cy, projCurrent.x - cx);
          const endAngle = Math.atan2(projNext.y - cy, projNext.x - cx);
          const crossProductZ = current.point.x * next.point.y - current.point.y * next.point.x;
          const counterClockwise = crossProductZ > 0;
          ctx.arc(cx, cy, radius, startAngle, endAngle, counterClockwise);
        } else {
          ctx.lineTo(projNext.x, projNext.y);
        }
      }

      ctx.closePath();
      ctx.fill();
    });
  });

  rotationDegrees += 0.3;
  if (rotationDegrees >= 360) rotationDegrees -= 360;

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
