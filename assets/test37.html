<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Extreme project() Profiling</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #globeCanvas {
      display: block;
      background: black;
    }
    #profileOutput {
      color: white;
      font-family: monospace;
      font-size: 13px;
      margin-top: 10px;
      background: #111;
      padding: 10px;
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      white-space: pre;
    }
  </style>
</head>
<body>

<canvas id="globeCanvas"></canvas>
<div id="profileOutput"></div>

<script src="continents.js"></script>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');
const profileOutput = document.getElementById('profileOutput');

let rotationDegrees = 0;
let tiltDegrees = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let autoRotate = true;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.7;
}
resize();
window.addEventListener('resize', resize);

function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad)
  };
}

function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA
  };
}

function rotateX(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x,
    y: p.y * cosA - p.z * sinA,
    z: p.y * sinA + p.z * cosA
  };
}

// 🚀 SUPER DETAILED project() PROFILING
function project(p, radius, cx, cy) {
  let t0, t1, t2, t3, t4, t5, start, end;

  start = performance.now();
  const x_read = p.x;
  end = performance.now();
  t0 = end - start;

  start = performance.now();
  const x_mul = x_read * radius;
  end = performance.now();
  t1 = end - start;

  start = performance.now();
  const x_final = cx + x_mul;
  end = performance.now();
  t2 = end - start;

  start = performance.now();
  const y_read = p.y;
  end = performance.now();
  t3 = end - start;

  start = performance.now();
  const y_mul = y_read * radius;
  end = performance.now();
  t4 = end - start;

  start = performance.now();
  const y_final = cy - y_mul;
  end = performance.now();
  t5 = end - start;

  // Accumulate timings
  timings["  project: read p.x"] = (timings["  project: read p.x"] || 0) + t0;
  timings["  project: p.x * radius"] = (timings["  project: p.x * radius"] || 0) + t1;
  timings["  project: cx + (p.x * r)"] = (timings["  project: cx + (p.x * r)"] || 0) + t2;
  timings["  project: read p.y"] = (timings["  project: read p.y"] || 0) + t3;
  timings["  project: p.y * radius"] = (timings["  project: p.y * radius"] || 0) + t4;
  timings["  project: cy - (p.y * r)"] = (timings["  project: cy - (p.y * r)"] || 0) + t5;

  return { x: x_final, y: y_final };
}

function subdivideContinent(continent, maxSegmentDegrees = 2) {
  const subdivided = [];
  for (let i = 0; i < continent.length; i++) {
    const current = continent[i];
    const next = continent[(i + 1) % continent.length];
    subdivided.push(current);
    const dLon = next.lon - current.lon;
    const dLat = next.lat - current.lat;
    const dist = Math.hypot(dLon, dLat);
    const segments = Math.ceil(dist / maxSegmentDegrees);
    for (let j = 1; j < segments; j++) {
      const t = j / segments;
      subdivided.push({
        lon: current.lon + dLon * t,
        lat: current.lat + dLat * t
      });
    }
  }
  return subdivided;
}

const subdividedContinents = continents.map(continent => subdivideContinent(continent, 2));

let timings = {};

function time(label, fn) {
  const start = performance.now();
  fn();
  const end = performance.now();
  if (!timings[label]) timings[label] = 0;
  timings[label] += (end - start);
}

function draw() {
  timings = {};
  const frameStart = performance.now();

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;
  const tiltRadians = tiltDegrees * Math.PI / 180;

  time("ctx.clearRect", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  time("ctx.fillRect (background)", () => {
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  time("ctx.save", () => ctx.save());

  time("ctx.arc (clip path)", () => {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  });

  time("ctx.clip", () => ctx.clip());

  time("ctx.arc (globe fill)", () => {
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  });

  time("ctx.fill (globe)", () => ctx.fill());

  // Stroke setup
  time("Set stroke style", () => {
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 1;
    ctx.lineJoin = 'round';
  });

  subdividedContinents.forEach(continent => {
    let rotatedVertices = [];
    time("Rotate vertices", () => {
      rotatedVertices = continent.map(p => {
        return rotateY(rotateX(sphericalToCartesian(p.lon, p.lat), tiltRadians), rotationRadians);
      });
    });

    time("ctx.beginPath", () => ctx.beginPath());

    let first;
    time("Project first vertex", () => {
      first = project(rotatedVertices[0], radius, cx, cy);
    });

    time("ctx.moveTo (first)", () => ctx.moveTo(first.x, first.y));

    for (let i = 1; i < rotatedVertices.length; i++) {
      let proj;
      time("Project vertex", () => {
        proj = project(rotatedVertices[i], radius, cx, cy);
      });
      time("ctx.lineTo", () => ctx.lineTo(proj.x, proj.y));
    }

    time("ctx.closePath", () => ctx.closePath());
    time("ctx.stroke", () => ctx.stroke());
  });

  time("ctx.restore", () => ctx.restore());

  if (autoRotate) {
    rotationDegrees += 0.1;
    if (rotationDegrees >= 360) rotationDegrees -= 360;
  }

  const frameEnd = performance.now();
  const frameDuration = frameEnd - frameStart;

  // Output profiling
  const sorted = Object.entries(timings).sort((a, b) => b[1] - a[1]);
  let output = `Frame time: ${frameDuration.toFixed(2)} ms\n\n`;
  for (const [label, t] of sorted) {
    const pct = ((t / frameDuration) * 100).toFixed(1);
    output += `${label.padEnd(40)} ${t.toFixed(2)} ms (${pct}%)\n`;
  }
  profileOutput.textContent = output;

  requestAnimationFrame(draw);
}

// Mouse interaction
canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  autoRotate = false;
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  autoRotate = false;
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - lastMouseX;
    const deltaY = -(e.clientY - lastMouseY);

    rotationDegrees += deltaX * 0.1;
    tiltDegrees -= deltaY * 0.1;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

draw();
</script>

</body>
</html>
