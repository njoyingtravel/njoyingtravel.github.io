<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Contours Only + Path2D Cached + FPS</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
    #fpsCounter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: lime;
      font-family: monospace;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<canvas id="globeCanvas"></canvas>
<div id="fpsCounter">FPS: 0</div>

<!-- Link to the continents.js file -->
<script src="continents.js"></script>

<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');
const fpsCounter = document.getElementById('fpsCounter');

let rotationDegrees = 0;
let tiltDegrees = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let autoRotate = true;

let cachedPaths = [];

// FPS calculation
let frameCount = 0;
let lastTime = performance.now();
let fps = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad)
  };
}

function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA
  };
}

function rotateX(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  return {
    x: p.x,
    y: p.y * cosA - p.z * sinA,
    z: p.y * sinA + p.z * cosA
  };
}

function project(p, radius, cx, cy) {
  return {
    x: cx + p.x * radius,
    y: cy - p.y * radius
  };
}

function subdivideContinent(continent, maxSegmentDegrees = 2) {
  const subdivided = [];
  for (let i = 0; i < continent.length; i++) {
    const current = continent[i];
    const next = continent[(i + 1) % continent.length];
    subdivided.push(current);
    const dLon = next.lon - current.lon;
    const dLat = next.lat - current.lat;
    const dist = Math.hypot(dLon, dLat);
    const segments = Math.ceil(dist / maxSegmentDegrees);
    for (let j = 1; j < segments; j++) {
      const t = j / segments;
      subdivided.push({
        lon: current.lon + dLon * t,
        lat: current.lat + dLat * t
      });
    }
  }
  return subdivided;
}

// Preprocess continents
const subdividedContinents = continents.map(continent => subdivideContinent(continent, 2));

// 🚀 NEW: Generate all the rotated Path2D shapes
function generateCachedPaths() {
  cachedPaths = [];

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;
  const tiltRadians = tiltDegrees * Math.PI / 180;

  subdividedContinents.forEach(continent => {
    const path = new Path2D();
    const rotatedVertices = continent
      .filter(p => p.lat > -84.351)
      .map(p => rotateY(rotateX(sphericalToCartesian(p.lon, p.lat), tiltRadians), rotationRadians));

    if (rotatedVertices.length === 0) return;

    const first = rotatedVertices[0];
    const projFirst = project(first, radius, cx, cy);
    path.moveTo(projFirst.x, projFirst.y);

    for (let i = 1; i < rotatedVertices.length; i++) {
      const p = rotatedVertices[i];
      const proj = project(p, radius, cx, cy);
      path.lineTo(proj.x, proj.y);
    }

    path.closePath();
    cachedPaths.push(path);
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;

  // Fill the globe
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // Draw cached coastlines
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  cachedPaths.forEach(path => {
    ctx.stroke(path);
  });

  if (autoRotate) {
    rotationDegrees += 0.1;
    if (rotationDegrees >= 360) rotationDegrees -= 360;
    generateCachedPaths(); // 🔥 REBUILD paths when rotating
  }

  // FPS counting
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    fpsCounter.textContent = `FPS: ${fps}`;
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  autoRotate = false;
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  autoRotate = false;
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - lastMouseX;
    const deltaY = -(e.clientY - lastMouseY);

    rotationDegrees += deltaX * 0.1;
    tiltDegrees -= deltaY * 0.1;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    generateCachedPaths(); // 🔥 REBUILD paths while dragging
  }
});

generateCachedPaths(); // Initial path generation
draw();
</script>
</body>
</html>
