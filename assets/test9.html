<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Globe - Fixed Boxes</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="globeCanvas"></canvas>
<script>
const canvas = document.getElementById('globeCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- CONTINENT DATA ---
// Added more points for better shape representation
const continents = [
  // Africa/Europe-ish
  [ {lon: -18, lat: 35}, {lon: 40, lat: 30}, {lon: 35, lat: 0}, {lon: 20, lat: -30}, {lon: -5, lat: -20}, {lon: -10, lat: 10} ],
  // Asia/Australia-ish
  [ {lon: 90, lat: 50}, {lon: 150, lat: 60}, {lon: 170, lat: 0}, {lon: 140, lat: -30}, {lon: 110, lat: -20}, {lon: 80, lat: 10} ],
  // Americas-ish
  [ {lon: -120, lat: 60}, {lon: -50, lat: 70}, {lon: -40, lat: 20}, {lon: -60, lat: -40}, {lon: -80, lat: -50}, {lon: -100, lat: 0}, {lon: -110, lat: 30} ]
];

// Convert lon/lat to 3D Cartesian coordinates (Unit Sphere)
function sphericalToCartesian(lon, lat) {
  const rad = Math.PI / 180;
  const lonRad = lon * rad;
  const latRad = lat * rad;
  const cosLat = Math.cos(latRad);
  return {
    x: cosLat * Math.sin(lonRad),
    y: Math.sin(latRad),
    z: cosLat * Math.cos(lonRad),
    lon: lon, // Keep original lon/lat for potential debugging
    lat: lat
  };
}

// Rotate a point around the Y-axis (vertical)
function rotateY(p, angleRad) {
  const cosA = Math.cos(angleRad);
  const sinA = Math.sin(angleRad);
  // Keep original lon/lat if needed, or recalculate if precision matters
  return {
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA,
    // lon: p.lon, lat: p.lat // Not strictly needed after rotation
  };
}

// Project 3D to 2D canvas coordinates (Orthographic)
function project(p, radius, cx, cy) {
  return {
    x: cx + p.x * radius,
    y: cy - p.y * radius
  };
}

// Finds next intersection around the polygon for smooth horizon arcs
// Find horizon intersection - returns the 3D point on the horizon (z=0, normalized x,y)
function findHorizonIntersection(p1, p2) {
    // Check if both points are on the same side of the horizon plane
    if ((p1.z >= 0 && p2.z >= 0) || (p1.z < 0 && p2.z < 0)) { // Use < 0 for invisible check
        return null;
    }

    // Parameter t representing the intersection point along the line segment p1 -> p2
    // t = p1.z / (p1.z - p2.z) ensures that the intersection has z = 0
    // Avoid division by zero (although the initial check should prevent this)
    const dz = p1.z - p2.z;
    if (Math.abs(dz) < 1e-9) return null; // Points are practically at the same depth near horizon

    const t = p1.z / dz;

    // Calculate intersection point coordinates
    let intersection = {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t,
        z: 0 // Intersection is on the z=0 plane
    };

    // Normalize the intersection point's x and y so it lies exactly on the unit circle horizon
    const len = Math.hypot(intersection.x, intersection.y);
     // Avoid division by zero if intersection is exactly at the origin (highly unlikely)
    if (len < 1e-9) return intersection; // Or handle as an error/special case

    intersection.x /= len;
    intersection.y /= len;

    // Mark this point as an intersection point (useful later)
    intersection.isIntersection = true;

    return intersection;
}

// Finds next intersection around the polygon for smooth horizon arcs
function findNextHorizonIntersection(vertices, startIndex) {
  const len = vertices.length;
  for (let offset = 0; offset < len; offset++) {
    const idx1 = (startIndex + offset) % len;
    const idx2 = (startIndex + offset + 1) % len;
    const inter = findHorizonIntersection(vertices[idx1], vertices[idx2]);
    if (inter) return inter;
  }
  return null;
}


// Draw smooth horizon arc between two intersection points
function drawHorizonArc(p1, p2, cx, cy, radius) {
  const angle1 = Math.atan2(p1.y - cy, p1.x - cx);
  const angle2 = Math.atan2(p2.y - cy, p2.x - cx);

  // Choose shortest arc direction
  let angleDiff = angle2 - angle1;
  if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
  else if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

  ctx.arc(cx, cy, radius, angle1, angle1 + angleDiff, angleDiff < 0);
}

let rotationDegrees = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.8;
  const rotationRadians = rotationDegrees * Math.PI / 180;

  // Draw Globe
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'lightblue';
  ctx.fill();
  ctx.strokeStyle = 'grey';
  ctx.stroke();

  ctx.fillStyle = 'darkgreen';

  continents.forEach(continent => {
    let rotated = continent.map(p => rotateY(sphericalToCartesian(p.lon, p.lat), rotationRadians));

    ctx.beginPath();
    let pathStarted = false;

    for (let i = 0; i <= rotated.length; i++) {
      const curr = rotated[i % rotated.length];
      const next = rotated[(i + 1) % rotated.length];

      const visibleCurr = curr.z >= 0;
      const visibleNext = next.z >= 0;

      if (visibleCurr) {
        const projCurr = project(curr, radius, cx, cy);
        if (!pathStarted) {
          ctx.moveTo(projCurr.x, projCurr.y);
          pathStarted = true;
        } else {
          ctx.lineTo(projCurr.x, projCurr.y);
        }
      }

      const intersection = findHorizonIntersection(curr, next);

      if (intersection) {
        const projIntersect = project(intersection, radius, cx, cy);

        if (!visibleCurr && visibleNext) {
          ctx.moveTo(projIntersect.x, projIntersect.y);
          pathStarted = true;
        } else if (visibleCurr && !visibleNext) {
          ctx.lineTo(projIntersect.x, projIntersect.y);
          pathStarted = false;

          // Draw arc along horizon smoothly
          const nextIntersection = findNextHorizonIntersection(rotated, (i + 1) % rotated.length);
          if (nextIntersection) {
            drawHorizonArc(projIntersect, project(nextIntersection, radius, cx, cy), cx, cy, radius);
          }
        }
      }
    }

    ctx.closePath();
    ctx.fill();
  });

  rotationDegrees += 0.3;
  if (rotationDegrees >= 360) rotationDegrees -= 360;

  requestAnimationFrame(draw);
}

// Start animation
draw();
</script>
</body>
</html>
